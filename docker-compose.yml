services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tkxel-vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tkxel_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tkxel_vault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tkxel-vault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-server:
    build:
      context: .
    container_name: tkxel-vault-api-server
    restart: unless-stopped
    command: ["pnpm", "run", "--filter", "@tkxel-vault/api-server", "start"]
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/tkxel_vault
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-gateway:
    build:
      context: .
    container_name: tkxel-vault-mcp-gateway
    restart: unless-stopped
    command: ["pnpm", "run", "--filter", "@tkxel-vault/mcp-gateway", "start"]
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/tkxel_vault
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  web-app:
    build:
      context: .
    container_name: tkxel-vault-web-app
    restart: unless-stopped
    command: ["pnpm", "run", "--filter", "@tkxel-vault/web-app", "preview", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      - api-server

volumes:
  postgres_data:
  redis_data:
