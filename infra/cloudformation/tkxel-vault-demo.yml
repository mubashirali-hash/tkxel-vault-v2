AWSTemplateFormatVersion: '2010-09-09'
Description: 'tkxel Vault: single-host stack on AWS EC2 with KMS envelope encryption, TLS termination and Secrets Manager'

Parameters:
  InstanceType:
    Type: String
    Default: 't3.small'
    AllowedValues: ['t3.micro', 't3.small', 't3.medium', 't3.large']
    Description: 'EC2 instance type for the demo container host.'

  KeyPairName:
    Type: String
    Description: 'Name of an existing EC2 KeyPair for SSH access (optional, leave blank to use SSM Session Manager).'
    Default: ''

  SshCidr:
    Type: String
    Description: 'CIDR allowed to reach SSH (port 22), e.g. 203.0.113.10/32. Leave blank to keep SSH closed and use SSM.'
    Default: ''
    AllowedPattern: '^$|^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'

  DomainName:
    Type: String
    Description: 'Public DNS name for the vault, e.g. vault.example.com. Point it at the PublicIp output; TLS certificates are issued for it automatically.'
    AllowedPattern: '^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'

  AcmeEmail:
    Type: String
    Description: 'Contact email for TLS certificate issuance.'
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  GoogleClientId:
    Type: String
    Description: 'Google Workspace OAuth client ID used for SSO sign-in.'
    Default: ''

  AllowedEmailDomains:
    Type: String
    Description: 'Comma-separated email domains allowed to sign in, e.g. tkxel.com.'
    Default: ''

  ProviderKeysSecretArn:
    Type: String
    Description: 'ARN of an existing Secrets Manager secret holding JSON {"ANTHROPIC_API_KEY":"...","OPENAI_API_KEY":"..."}. Create it before launching the stack.'
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:.+'

  GitRef:
    Type: String
    Description: 'Git branch or tag to deploy.'
    Default: 'main'

  LatestUbuntuAmi:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: 'SSM parameter dynamically resolving latest Ubuntu 24.04 LTS AMI in the current region.'

Resources:
  # 1. AWS KMS Master Key for Envelope Encryption
  TkxelKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'tkxel Vault Master Key Encryption Key (KEK) for envelope encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: 'tkxel-vault-kms-policy'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  TkxelKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: 'alias/tkxel-vault-demo-key'
      TargetKeyId: !Ref TkxelKmsKey

  # 2. Security Group
  VaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for tkxel Vault Demo Host'
      SecurityGroupIngress:
        # Only the TLS proxy is public. Port 80 exists for certificate issuance and the HTTPS redirect.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSshCidr
    Properties:
      GroupId: !GetAtt VaultSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr

  # 2b. Generated secrets (NFR-09). Values never appear in the template, parameters or outputs.
  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'tkxel Vault PostgreSQL password'
      KmsKeyId: !Ref TkxelKmsKey
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  RunnerSharedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'tkxel Vault gateway-to-runner service token secret'
      KmsKeyId: !Ref TkxelKmsKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  SsoWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'tkxel Vault SSO deprovisioning webhook secret'
      KmsKeyId: !Ref TkxelKmsKey
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: 'tkxel Vault MCP session signing secret'
      KmsKeyId: !Ref TkxelKmsKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # 3. IAM Role for Instance (Access to KMS and SSM)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: ['ec2.amazonaws.com']
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: 'TkxelKmsAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'kms:Encrypt'
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                Resource: !GetAtt TkxelKmsKey.Arn
        - PolicyName: 'TkxelSecretsRead'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: ['secretsmanager:GetSecretValue']
                Resource:
                  - !Ref DatabasePasswordSecret
                  - !Ref RunnerSharedSecret
                  - !Ref SsoWebhookSecret
                  - !Ref SessionSecret
                  - !Ref ProviderKeysSecretArn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # 4. EC2 Demo Instance (Ubuntu 24.04 LTS)
  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !GetAtt VaultSecurityGroup.GroupId
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      ImageId: !Ref LatestUbuntuAmi
      BlockDeviceMappings:
        - DeviceName: '/dev/sda1'
          Ebs:
            VolumeSize: 30
            VolumeType: 'gp3'
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: tkxel-vault-host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          echo "==> Setting up tkxel Vault Demo Host..."
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg git jq unzip

          # AWS CLI v2 (used only to read this stack's secrets)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/awscliv2.zip

          # Install Docker
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # Clone tkxel Vault
          mkdir -p /opt/tkxel-vault
          cd /opt/tkxel-vault
          if [ ! -d ".git" ]; then
            git clone --branch "${GitRef}" https://github.com/mubashirali-hash/tkxel-vault-v2.git .
          else
            git fetch origin && git checkout "${GitRef}" && git pull --ff-only origin "${GitRef}"
          fi

          # Secrets come from AWS Secrets Manager at boot (NFR-09). They are written to a root-only file
          # for Docker Compose and never appear in the template, instance metadata or logs.
          secret() { aws secretsmanager get-secret-value --region "${AWS::Region}" --secret-id "$1" --query SecretString --output text; }
          PROVIDER_KEYS="$(secret '${ProviderKeysSecretArn}')"
          umask 077
          cat > .env <<ENVFILE
          NODE_ENV=production
          VAULT_DOMAIN=${DomainName}
          ACME_EMAIL=${AcmeEmail}
          POSTGRES_PASSWORD=$(secret '${DatabasePasswordSecret}')
          RUNNER_SHARED_SECRET=$(secret '${RunnerSharedSecret}')
          SSO_WEBHOOK_SECRET=$(secret '${SsoWebhookSecret}')
          MCP_SESSION_SECRET=$(secret '${SessionSecret}')
          KMS_PROVIDER=aws
          AWS_KMS_KEY_ID=${TkxelKmsKey.Arn}
          AWS_REGION=${AWS::Region}
          GOOGLE_CLIENT_ID=${GoogleClientId}
          ALLOWED_EMAIL_DOMAINS=${AllowedEmailDomains}
          EMBEDDING_PROVIDER=openai
          ANTHROPIC_API_KEY=$(echo "$PROVIDER_KEYS" | jq -r '.ANTHROPIC_API_KEY')
          OPENAI_API_KEY=$(echo "$PROVIDER_KEYS" | jq -r '.OPENAI_API_KEY')
          ENVFILE
          sed -i 's/^[[:space:]]*//' .env
          chmod 600 .env
          unset PROVIDER_KEYS

          # Start the stack behind the TLS proxy; no application port is published directly
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
          echo "==> tkxel Vault running at https://${DomainName}"

  # 5. Elastic IP for static public address
  DemoElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref DemoInstance

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]
  HasSshCidr: !Not [!Equals [!Ref SshCidr, '']]

Outputs:
  WebUrl:
    Description: 'tkxel Vault web application (HTTPS)'
    Value: !Sub 'https://${DomainName}'
  ApiUrl:
    Description: 'API server (HTTPS)'
    Value: !Sub 'https://${DomainName}/api'
  McpGatewayUrl:
    Description: 'Streamable HTTP MCP gateway endpoint to register as a Claude custom connector'
    Value: !Sub 'https://${DomainName}/mcp'
  KmsKeyArn:
    Description: 'AWS KMS Master Key ARN'
    Value: !GetAtt TkxelKmsKey.Arn
  PublicIp:
    Description: 'Public IP address of the Demo Host'
    Value: !Ref DemoElasticIp
  InstanceId:
    Description: 'EC2 Instance ID for AWS SSM Management'
    Value: !Ref DemoInstance
