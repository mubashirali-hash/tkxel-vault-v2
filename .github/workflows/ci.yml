name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build, Test & Release-Claim Guard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tkxel_vault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tkxel_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: pnpm turbo run lint

      - name: Typecheck Workspaces
        run: pnpm turbo run typecheck

      - name: Build Packages & Apps
        run: pnpm turbo run build --force

      - name: Apply Real Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
        run: pnpm db:migrate

      - name: Verify Release Claims Have Acceptance Evidence
        run: pnpm verify:release-claims

      - name: Test Release-Claim Guard
        run: node --test scripts/verify-release-claims.test.mjs

      - name: Run Full Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
          REDIS_URL: redis://localhost:6379
        run: pnpm turbo run test --force

  images:
    name: Build Production Images & Boot Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tkxel_vault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tkxel_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      STACK_ENV: >-
        -e DATABASE_URL=postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
        -e REDIS_URL=redis://localhost:6379
        -e RUNNER_SHARED_SECRET=ci-boot-check-runner-secret-0123456789abcdef
        -e SSO_WEBHOOK_SECRET=ci-boot-check-webhook-secret-0123456789
        -e EMBEDDING_PROVIDER=deterministic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build every image target
        run: |
          for target in migration api-server mcp-gateway skill-runner web-app; do
            docker build --target "$target" -t "tkxel-vault/$target:ci" .
          done

      - name: Apply migrations with the migration image
        run: docker run --rm --network host $STACK_ENV tkxel-vault/migration:ci

      - name: Production mode refuses to start without an approved KMS and model key
        run: |
          if docker run --rm --network host $STACK_ENV -e NODE_ENV=production tkxel-vault/skill-runner:ci > refusal.log 2>&1; then
            echo "skill-runner started in production mode without KMS or model configuration"; cat refusal.log; exit 1
          fi
          grep -E "FATAL|forbidden|requires" refusal.log

      - name: Boot the services (development mode, test doubles for KMS and the model)
        run: |
          DEV="-e NODE_ENV=development -e KMS_PROVIDER=mock -e ALLOW_DEV_MOCK_KMS=true -e ALLOW_DEV_MOCK_LLM=true -e ALLOW_DEV_HOST_SANDBOX=true -e ENABLE_DEV_AUTH_BYPASS=true"
          docker run -d --name runner --network host $STACK_ENV $DEV -e PORT=3003 -e HOME=/tmp --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges:true tkxel-vault/skill-runner:ci
          docker run -d --name api --network host $STACK_ENV $DEV -e SKILL_RUNNER_URL=http://localhost:3003 tkxel-vault/api-server:ci
          docker run -d --name gateway --network host $STACK_ENV $DEV -e SKILL_RUNNER_URL=http://localhost:3003 -e MCP_DEV_HMAC_SECRET=ci-boot-check-gateway-hmac-secret-0123456789 tkxel-vault/mcp-gateway:ci
          docker run -d --name web -p 8080:80 tkxel-vault/web-app:ci
          sleep 15
          docker ps -a --format '{{.Names}} {{.Status}}'

      - name: Services answer and run unprivileged
        run: |
          set -x
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/vaults)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:3001/mcp)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3003/health)" = "200"
          test "$(curl -s http://localhost:8080/healthz)" = "ok"
          for c in runner api gateway; do test "$(docker exec $c id -u)" = "10001"; done

      - name: Container logs
        if: always()
        run: for c in runner api gateway web; do echo "== $c"; docker logs --tail 40 $c 2>&1 || true; done

  oauth:
    name: OAuth 2.1 End-to-End (Keycloak + MCP Gateway)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tkxel_vault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tkxel_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
      KMS_PROVIDER: mock
      ALLOW_DEV_MOCK_KMS: "true"
      EMBEDDING_PROVIDER: deterministic
      RUNNER_SHARED_SECRET: ci-oauth-check-runner-secret-0123456789abcdef
      SSO_WEBHOOK_SECRET: ci-oauth-check-webhook-secret-0123456789
      GATEWAY_URL: http://localhost:3001
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_ADMIN: admin
      E2E_USER_EMAIL: e2e.reader@tkxel-test.local

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Keycloak
        run: |
          echo "KEYCLOAK_ADMIN_PASSWORD=kc-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=e2e-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          source <(tail -2 "$GITHUB_ENV" | sed 's/^/export /')
          docker run -d --name keycloak --network host -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" quay.io/keycloak/keycloak:26.0 start-dev --http-port=8080

      - name: Install and build
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@tkxel-vault/mcp-gateway...

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          cd services/mcp-gateway
          node scripts/oauth-e2e-seed.mjs | tee seed.out
          echo "E2E_VAULT_ID=$(grep VAULT_ID= seed.out | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Start the gateway with Keycloak as its authorization server
        env:
          OIDC_ISSUER: http://localhost:8080/realms/tkxel-vault
          OIDC_AUDIENCE: http://localhost:3001/mcp
          OAUTH_AUTHORIZATION_SERVERS: http://localhost:8080/realms/tkxel-vault
          MCP_PUBLIC_URL: http://localhost:3001
        run: |
          cd services/mcp-gateway
          nohup node dist/start.js > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/health && break; sleep 1; done
          echo "gateway health: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health)"

      - name: Wait for Keycloak and configure the realm
        run: |
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:8080/realms/master && break; sleep 2; done
          cd services/mcp-gateway && node scripts/oauth-e2e-check.mjs --setup

      - name: Run the MCP client flow
        run: cd services/mcp-gateway && node scripts/oauth-e2e-check.mjs

      - name: Logs
        if: always()
        run: |
          echo "== gateway"; tail -40 services/mcp-gateway/gateway.log || true
          echo "== keycloak"; docker logs --tail 30 keycloak 2>&1 || true

