name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build, Test & Release-Claim Guard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tkxel_vault
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tkxel_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: pnpm turbo run lint

      - name: Typecheck Workspaces
        run: pnpm turbo run typecheck

      - name: Build Packages & Apps
        run: pnpm turbo run build --force

      - name: Apply Real Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
        run: pnpm db:migrate

      - name: Verify Release Claims Have Acceptance Evidence
        run: pnpm verify:release-claims

      - name: Test Release-Claim Guard
        run: node --test scripts/verify-release-claims.test.mjs

      - name: Run Full Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/tkxel_vault
          REDIS_URL: redis://localhost:6379
        run: pnpm turbo run test --force
